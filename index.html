<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Vaishnavi Singh</title>
  </head>
  <!-- The theme is applied before first paint, so a page opening at dusk
       never shows a flash of daylight while the app loads. -->
  <script>
    try {
      // Falls back to dusk, matching site.defaultTheme in src/data/site.ts.
      if ((localStorage.getItem('estate.theme') || 'dusk') === 'dusk') document.documentElement.dataset.theme = 'dusk'
    } catch {}
  </script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
