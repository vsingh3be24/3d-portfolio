    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <title>Vaishnavi Singh · Portfolio</title>

  <!-- The theme is applied before first paint, so a page opening at dusk
       never shows a flash of daylight while the app loads. -->
  <script>
    try {
      // Falls back to dusk, matching site.defaultTheme in src/data/site.ts.
      if ((localStorage.getItem('estate.theme') || 'dusk') === 'dusk') document.documentElement.dataset.theme = 'dusk'
    } catch {}
  </script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
